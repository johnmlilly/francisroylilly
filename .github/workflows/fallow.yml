name: Fallow Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned to a commit, not the mutable v3 tag: this job holds
      # pull-requests: write, so whoever controls the tag would control the
      # token. Bump deliberately alongside the fallow devDependency.
      - uses: fallow-rs/fallow@6605f96806787f85124bfc144124ff7e44733b06 # v3.34.1
        continue-on-error: true
        with:
          command: audit
          comment: true
          fail-on-issues: false

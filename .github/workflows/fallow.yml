name: Fallow Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@v3
        continue-on-error: true
        with:
          command: audit
          comment: true
          fail-on-issues: false

name: Notify subscribers

# Fires when blog content lands on main. Cloudflare Workers Builds deploys the
# same push a few minutes later, and /api/notify reads posts from the deployed
# bundle, so this job first waits until /api/version reports this commit.
# The Worker decides which published posts are new (PostNotification table),
# so editing drafts sends nothing. Re-run via workflow_dispatch if a send fails.
on:
  push:
    branches: [main]
    paths: ['src/content/blog/**']
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes must not race each other into double sends.
concurrency:
  group: notify-subscribers
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Workers Builds to deploy this commit
        run: |
          # 24 x 15s = 6 minute ceiling; exits on the first match. Logs the
          # status code and body: a bare `curl -sf` reports a late deploy and a
          # rejected request identically, as an empty string.
          for attempt in $(seq 1 24); do
            if response=$(curl -sS --max-time 20 -w '\n%{http_code}' https://francisroylilly.com/api/version); then
              code=${response##*$'\n'}
              body=${response%$'\n'*}
            else
              code=000
              body=
            fi

            deployed=$(printf '%s' "$body" | jq -r '.sha // empty' 2>/dev/null || echo '')
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "Deployed commit matches: $deployed"
              exit 0
            fi

            echo "HTTP $code, deployed='$deployed', waiting for ${{ github.sha }} ($attempt/24)"
            if [ "$code" != "200" ]; then
              printf 'Response body (first 500 bytes): %.500s\n' "$body"
            fi
            sleep 15
          done
          echo "Timed out after 6 minutes waiting for the deploy" >&2
          exit 1

      - name: Trigger /api/notify
        run: |
          # `Content-Type: application/json` is required, not cosmetic: Astro's
          # `security.checkOrigin` rejects an on-demand POST that looks like a
          # cross-site form submission with 403 "Cross-site POST form
          # submissions are forbidden", and this request carries no Origin.
          if response=$(curl -sS --max-time 60 -w '\n%{http_code}' -X POST \
            "https://francisroylilly.com/api/notify" \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: ${{ secrets.NOTIFY_SECRET }}"); then
            code=${response##*$'\n'}
            body=${response%$'\n'*}
          else
            code=000
            body=
          fi

          printf 'HTTP %s\n' "$code"
          printf 'Response body (first 2000 bytes): %.2000s\n' "$body"
          [ "$code" = "200" ]

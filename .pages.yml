media:
  input: src/assets/blog
  output: /src/assets/blog

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    view:
      fields: [title, pubDate, author, isPublished]
      primary: title
      sort: [pubDate]
    fields:
      - { label: "Title", name: "title", type: "string" }
      - { label: "Description", name: "description", type: "text" }
      - { label: "Date", name: "pubDate", type: "date" }
      - { label: "Author", name: "author", type: "string" }
      - { label: "Published", name: "isPublished", type: "boolean", default: false }
      - { label: "Hero Image", name: "heroImage", type: "image" }
      - { label: "Gallery Photos", name: "galleryPhotos", type: "image", list: true }
      - { label: "Body", name: "body", type: "rich-text" }

settings:
  content:
    merge: true
